name: GitHub Readme YouTube Cards
on:
  schedule:
    # Runs every hour, on the hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          playlist_id: UULF2WHjPDvbE6O328n17ZGcfg
          comment_tag_name: YOUTUBE-CARDS
          youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
          show_duration: true

      - name: Update YouTube badges
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 .github/scripts/youtube_stats.py

      - name: Commit YouTube stats update
        uses: EndBug/add-and-commit@v9
        with:
          message: "docs(readme): Update YouTube stats"
          add: "README.md .github/assets/youtube-subscribers.svg .github/assets/youtube-views.svg"
          author_name: "GitHub Actions"
          author_email: "41898282+github-actions[bot]@users.noreply.github.com"
